<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RMSTORVIX Admin Console — SaaS Governance</title>
    <script>
      document.documentElement.setAttribute("data-theme", "dark");
      document.documentElement.style.colorScheme = "dark";
    </script>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230ea5e9'/%3E%3Cpath d='M9 11l7-4 7 4v10l-7 4-7-4V11z' fill='none' stroke='%23fff' stroke-width='2'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/css/tokens.css?v=20261126-audit" />
    <link rel="stylesheet" href="/css/styles.css?v=20261126-audit" />
    <link rel="stylesheet" href="/css/admin.css?v=20261126-audit" />
  </head>
  <body class="admin-body">
    <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
    <div id="admin-auth-shell" class="admin-auth-shell is-hidden" aria-label="Administrator Authentication"></div>

    <div id="admin-app-shell" class="app-shell admin-app-shell is-hidden">
      <div id="admin-sidebar-backdrop" class="sidebar-backdrop" aria-hidden="true"></div>

      <aside id="admin-sidebar" class="sidebar admin-glass-sidebar" aria-label="Administrator navigation">
        <div class="sidebar-top-group">
          <div class="sidebar-header">
            <div class="brand">
              <span class="brand-mark admin-brand-mark" aria-hidden="true">RX</span>
              <div class="brand-text">
                <span class="brand-title">RMSTORVIX</span>
                <span class="brand-subtitle">Admin Control Plane</span>
              </div>
            </div>
            <button
              id="admin-sidebar-close-btn"
              type="button"
              class="btn btn-icon sidebar-close-btn"
              aria-label="Close navigation menu"
            >
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          </div>

          <nav class="sidebar-nav" aria-label="Admin sections">
            <ul class="nav-list">
              <li><a href="#/overview" class="nav-item-btn admin-nav-btn" data-section="overview"><span>Admin Dashboard</span></a></li>
              <li><a href="#/approvals" class="nav-item-btn admin-nav-btn" data-section="approvals"><span>Pending Approvals</span></a></li>
              <li><a href="#/users" class="nav-item-btn admin-nav-btn" data-section="users"><span>User Management</span></a></li>
              <li><a href="#/subscriptions" class="nav-item-btn admin-nav-btn" data-section="subscriptions"><span>Subscriptions</span></a></li>
              <li><a href="#/codes" class="nav-item-btn admin-nav-btn" data-section="codes"><span>Activation Codes</span></a></li>
              <li><a href="#/plans" class="nav-item-btn admin-nav-btn" data-section="plans"><span>Plans &amp; Quotas</span></a></li>
              <li><a href="#/notifications" class="nav-item-btn admin-nav-btn" data-section="notifications"><span>Notifications</span></a></li>
              <li><a href="#/reports" class="nav-item-btn admin-nav-btn" data-section="reports"><span>SaaS Reports</span></a></li>
              <li><a href="#/audit" class="nav-item-btn admin-nav-btn" data-section="audit"><span>Audit Logs</span></a></li>
              <li><a href="#/settings" class="nav-item-btn admin-nav-btn" data-section="settings"><span>Admin Settings</span></a></li>
            </ul>
          </nav>
        </div>

        <div class="sidebar-footer">
          <p id="admin-footer-name" class="sidebar-footer-title">Platform Administrator</p>
          <p id="admin-footer-email" class="sidebar-footer-meta">Not signed in</p>
        </div>
      </aside>

      <div class="main-wrapper">
        <header class="topbar admin-glass-topbar">
          <div class="topbar-left">
            <button
              id="admin-menu-toggle-btn"
              type="button"
              class="btn btn-icon menu-toggle-btn"
              aria-label="Toggle admin menu"
              aria-controls="admin-sidebar"
              aria-expanded="true"
            >
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
              </svg>
            </button>
            <h1 id="admin-topbar-title" class="page-title">Admin Dashboard</h1>
          </div>

          <div class="topbar-actions">
            <a href="/" class="btn btn-sm">Business Portal</a>
            <button id="admin-refresh-btn" type="button" class="btn btn-sm">Refresh Data</button>
            <button id="admin-sign-out-btn" type="button" class="btn btn-sm btn-danger">Sign Out</button>
          </div>
        </header>

        <main id="admin-main-content" class="main-content" tabindex="-1"></main>
      </div>
    </div>

    <script src="/app-config.js"></script>
    <script type="module" src="/js/adminApp.js?v=20261126-prod"></script>
  </body>
</html>
